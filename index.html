<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pure Code Nature Window</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: system-ui; }

  .window { position: fixed; inset: 0; overflow: hidden; }

  /* SKY */
  #sky {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, #7bb0ff, #bcd9ff 40%, #dff3ff 70%);
    transition: filter .5s ease, background .5s ease;
  }

  /* MOUNTAINS (pure CSS shapes) */
  #mountains {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 30% 80%, #4a5a6a 0%, transparent 60%),
      radial-gradient(circle at 70% 85%, #5c6d7e 0%, transparent 60%),
      radial-gradient(circle at 50% 95%, #3c4a55 0%, transparent 60%);
    filter: blur(2px);
    opacity: 0.9;
    transition: filter .5s ease;
  }

  /* LAKE REFLECTION */
  #lake {
    position: absolute;
    inset: 50% 0 0 0;
    background:
      linear-gradient(to bottom, rgba(255,255,255,0.2), rgba(0,0,0,0.4)),
      radial-gradient(circle at 30% 20%, #4a5a6a 0%, transparent 60%),
      radial-gradient(circle at 70% 25%, #5c6d7e 0%, transparent 60%),
      radial-gradient(circle at 50% 35%, #3c4a55 0%, transparent 60%);
    filter: blur(3px);
    opacity: 0.7;
  }

  /* FOG */
  #fog {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 80%, rgba(255,255,255,0.4), transparent 70%);
    mix-blend-mode: screen;
    opacity: 0.2;
    transition: opacity .3s ease;
  }

  /* WHITEOUT */
  #whiteout {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.25);
    mix-blend-mode: screen;
    opacity: 0;
    transition: opacity .3s ease;
  }

  /* CLOUDS */
  #clouds {
    position: absolute;
    inset: -20% -40%;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.25), transparent 55%),
      radial-gradient(circle at 60% 40%, rgba(255,255,255,.22), transparent 55%),
      radial-gradient(circle at 80% 60%, rgba(255,255,255,.20), transparent 55%);
    filter: blur(18px);
    opacity: .45;
    animation: drift 60s linear infinite;
  }

  @keyframes drift {
    0%   { transform: translateX(-10%); }
    50%  { transform: translateX(10%); }
    100% { transform: translateX(-10%); }
  }

  /* RAIN CANVAS */
  #rainCanvas {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  /* UI */
  .ui {
    position: absolute;
    bottom: 20px;
    left: 20px;
    background: rgba(0,0,0,.5);
    padding: 12px;
    border-radius: 10px;
    backdrop-filter: blur(8px);
    color: #fff;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  input[type=range] { width: 180px; }
</style>
</head>
<body>

<div class="window">
  <div id="sky"></div>
  <div id="mountains"></div>
  <div id="lake"></div>
  <div id="clouds"></div>
  <div id="fog"></div>
  <div id="whiteout"></div>
  <canvas id="rainCanvas"></canvas>

  <div class="ui">
    <div>
      Rain
      <input id="rainSlider" type="range" min="50" max="700" value="250">
    </div>

    <div>
      Time
      <input id="timeSlider" type="range" min="0" max="100" value="50">
    </div>
  </div>
</div>

<script>
/* RAIN ENGINE */
const canvas = document.getElementById("rainCanvas");
const ctx = canvas.getContext("2d");
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let drops = [];
let dropCount = 250;
let speedMultiplier = 1.6;

function initRain() {
  drops = [];
  for (let i = 0; i < dropCount; i++) {
    drops.push({
      x: Math.random() * W,
      y: Math.random() * H,
      len: 10 + Math.random() * 20,
      speed: (3 + Math.random() * 6) * speedMultiplier
    });
  }
}
initRain();

function drawRain() {
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(210,225,255,0.7)";
  ctx.lineWidth = 1;

  drops.forEach(d => {
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x + d.len * 0.2, d.y + d.len);
    ctx.stroke();

    d.y += d.speed;
    d.x += d.speed * 0.2;

    if (d.y > H) {
      d.y = -20;
      d.x = Math.random() * W;
    }
  });

  requestAnimationFrame(drawRain);
}
drawRain();

/* FOG + WHITEOUT */
const fog = document.getElementById("fog");
const whiteout = document.getElementById("whiteout");

/* RAIN SLIDER */
document.getElementById("rainSlider").addEventListener("input", e => {
  dropCount = Number(e.target.value);
  speedMultiplier = 1 + (dropCount / 700) * 1.6;
  initRain();

  const t = dropCount / 700;
  fog.style.opacity = 0.1 + t * 0.5;
  whiteout.style.opacity = t * 0.4;
});

/* TIME SLIDER */
document.getElementById("timeSlider").addEventListener("input", e => {
  const v = e.target.value / 100;

  // sky color shift
  const sky = document.getElementById("sky");
  sky.style.filter = `brightness(${0.6 + v})`;

  // mountains darker at night
  const mountains = document.getElementById("mountains");
  mountains.style.filter = `brightness(${0.5 + v})`;

  // lake reflection brightness
  const lake = document.getElementById("lake");
  lake.style.filter = `brightness(${0.5 + v})`;
});
</script>

</body>
</html>
