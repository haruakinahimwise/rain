<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nature RTX Window — FIXED</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: system-ui; }

  .window { position: fixed; inset: 0; overflow: hidden; }

  .layer {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    transition: opacity .5s ease, filter .5s ease;
  }

  #fog {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.15);
    mix-blend-mode: screen;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease;
  }

  #whiteout {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.25);
    mix-blend-mode: screen;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease;
  }

  #rainCanvas {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .ui {
    position: absolute;
    bottom: 20px;
    left: 20px;
    background: rgba(0,0,0,.5);
    padding: 12px;
    border-radius: 10px;
    backdrop-filter: blur(8px);
    color: #fff;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  button {
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,.3);
    background: rgba(255,255,255,.1);
    color: #fff;
    cursor: pointer;
  }

  button.active {
    background: #4f8cff;
    border-color: #fff;
  }

  input[type=range] { width: 180px; }
</style>
</head>
<body>

<div class="window">
  <div id="layer" class="layer"></div>
  <div id="fog"></div>
  <div id="whiteout"></div>
  <canvas id="rainCanvas"></canvas>

  <div class="ui">
    <div style="display:flex; gap:6px;">
      <button class="scene" data-bg="https://upload.wikimedia.org/wikipedia/commons/0/0c/Misty_mountain_lake.jpg">🌫 Mist</button>
      <button class="scene" data-bg="https://upload.wikimedia.org/wikipedia/commons/3/3f/Forest_fog_valley.jpg">🌲 Forest</button>
      <button class="scene" data-bg="https://upload.wikimedia.org/wikipedia/commons/5/5f/Mountain_range_panorama.jpg">⛰ Peaks</button>
      <button class="scene" data-bg="https://upload.wikimedia.org/wikipedia/commons/4/4f/Mountain_sunset.jpg">🌇 Sunset</button>
    </div>

    <div>
      Rain
      <input id="rainSlider" type="range" min="50" max="700" value="250">
    </div>

    <div>
      Time
      <input id="timeSlider" type="range" min="0" max="100" value="50">
    </div>
  </div>
</div>

<script>
/* Background switching */
const layer = document.getElementById("layer");
const sceneButtons = document.querySelectorAll(".scene");

sceneButtons.forEach(btn => {
  btn.addEventListener("click", () => {
    sceneButtons.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    layer.style.opacity = 0;
    setTimeout(() => {
      layer.style.backgroundImage = `url(${btn.dataset.bg})`;
      layer.style.opacity = 1;
    }, 200);
  });
});

/* Default scene */
layer.style.backgroundImage =
  "url(https://upload.wikimedia.org/wikipedia/commons/0/0c/Misty_mountain_lake.jpg)";
sceneButtons[0].classList.add("active");

/* Rain engine */
const canvas = document.getElementById("rainCanvas");
const ctx = canvas.getContext("2d");
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let drops = [];
let dropCount = 250;
let speedMultiplier = 1.6;

function initRain() {
  drops = [];
  for (let i = 0; i < dropCount; i++) {
    drops.push({
      x: Math.random() * W,
      y: Math.random() * H,
      len: 10 + Math.random() * 20,
      speed: (3 + Math.random() * 6) * speedMultiplier
    });
  }
}
initRain();

function drawRain() {
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(210,225,255,0.7)";
  ctx.lineWidth = 1;

  drops.forEach(d => {
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x + d.len * 0.2, d.y + d.len);
    ctx.stroke();

    d.y += d.speed;
    d.x += d.speed * 0.2;

    if (d.y > H) {
      d.y = -20;
      d.x = Math.random() * W;
    }
  });

  requestAnimationFrame(drawRain);
}
drawRain();

/* Fog + whiteout */
const fog = document.getElementById("fog");
const whiteout = document.getElementById("whiteout");

/* Rain slider */
document.getElementById("rainSlider").addEventListener("input", e => {
  dropCount = Number(e.target.value);
  speedMultiplier = 1 + (dropCount / 700) * 1.6;
  initRain();

  const t = dropCount / 700;
  fog.style.opacity = 0.1 + t * 0.5;
  whiteout.style.opacity = t * 0.4;
});

/* Time slider */
document.getElementById("timeSlider").addEventListener("input", e => {
  const v = e.target.value / 100;
  const brightness = 0.4 + v * 1.2;
  const tint = (v - 0.5) * 40;

  layer.style.filter = `brightness(${brightness}) hue-rotate(${tint}deg)`;
});
</script>

</body>
</html>
