<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tokyo RTX Window — Fixed</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: system-ui; }

  .window {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }

  /* CITY LAYERS */
  .layer {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    transition: opacity .6s ease, filter .6s ease;
    will-change: transform;
  }

  #layer-back { filter: brightness(.7) blur(1px); }
  #layer-mid { mix-blend-mode: screen; opacity: .8; }
  #layer-front { mix-blend-mode: screen; opacity: .9; }

  /* RAIN CANVAS */
  #rainCanvas {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  /* UI */
  .ui {
    position: absolute;
    bottom: 20px;
    left: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: rgba(0,0,0,.4);
    padding: 14px;
    border-radius: 12px;
    backdrop-filter: blur(8px);
  }

  button {
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,.3);
    background: rgba(255,255,255,.1);
    color: #fff;
    cursor: pointer;
  }

  button:hover {
    background: rgba(255,255,255,.2);
  }

  .slider-box {
    display: flex;
    flex-direction: column;
    gap: 4px;
    color: #fff;
    font-size: 12px;
  }

  input[type=range] {
    width: 180px;
  }
</style>
</head>
<body>

<div class="window">
  <div id="layer-back" class="layer"></div>
  <div id="layer-mid" class="layer"></div>
  <div id="layer-front" class="layer"></div>
  <canvas id="rainCanvas"></canvas>

  <div class="ui">
    <div style="display:flex; gap:6px;">
      <button onclick="setScene('night')">🌃 Night</button>
      <button onclick="setScene('rain')">🌧 Rain</button>
      <button onclick="setScene('sunset')">🌇 Sunset</button>
      <button onclick="setScene('clear')">🌤 Clear</button>
    </div>

    <div class="slider-box">
      Rain Level
      <input id="rainSlider" type="range" min="50" max="600" value="250">
    </div>

    <div class="slider-box">
      Time of Day
      <input id="timeSlider" type="range" min="0" max="100" value="50">
    </div>
  </div>
</div>

<script>
/* SCENE IMAGES */
const scenes = {
  night: {
    back: "https://images.unsplash.com/photo-1505761671935-60b3a7427bad",
    mid: "https://images.unsplash.com/photo-1500534314211-0a24cd03f2c0",
    front: "https://images.unsplash.com/photo-1518300670681-9bbd45a4a8bb"
  },
  rain: {
    back: "https://images.unsplash.com/photo-1501594907352-04cda38ebc29",
    mid: "https://images.unsplash.com/photo-1501594907352-04cda38ebc29",
    front: "https://images.unsplash.com/photo-1501594907352-04cda38ebc29"
  },
  sunset: {
    back: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee",
    mid: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee",
    front: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
  },
  clear: {
    back: "https://images.unsplash.com/photo-1500043201641-5f04c36c12c7",
    mid: "https://images.unsplash.com/photo-1500043201641-5f04c36c12c7",
    front: "https://images.unsplash.com/photo-1500043201641-5f04c36c12c7"
  }
};

const back = document.getElementById("layer-back");
const mid = document.getElementById("layer-mid");
const front = document.getElementById("layer-front");

function setScene(name) {
  const s = scenes[name];
  back.style.opacity = 0;
  mid.style.opacity = 0;
  front.style.opacity = 0;

  setTimeout(() => {
    back.style.backgroundImage = `url(${s.back})`;
    mid.style.backgroundImage = `url(${s.mid})`;
    front.style.backgroundImage = `url(${s.front})`;

    back.style.opacity = 1;
    mid.style.opacity = 1;
    front.style.opacity = 1;
  }, 300);
}

/* PARALLAX */
document.addEventListener("mousemove", e => {
  const x = (e.clientX / innerWidth - 0.5) * 2;
  const y = (e.clientY / innerHeight - 0.5) * 2;

  back.style.transform = `translate(${x * -6}px, ${y * -3}px)`;
  mid.style.transform = `translate(${x * -12}px, ${y * -6}px)`;
  front.style.transform = `translate(${x * -18}px, ${y * -9}px)`;
});

/* RAIN */
const canvas = document.getElementById("rainCanvas");
const ctx = canvas.getContext("2d");
let W, H;

function resize() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

let drops = [];
let dropCount = 250;

function initRain() {
  drops = [];
  for (let i = 0; i < dropCount; i++) {
    drops.push({
      x: Math.random() * W,
      y: Math.random() * H,
      len: 10 + Math.random() * 20,
      speed: 4 + Math.random() * 6
    });
  }
}
initRain();

function drawRain() {
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(190,210,255,0.7)";
  ctx.lineWidth = 1;

  drops.forEach(d => {
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x + d.len * 0.2, d.y + d.len);
    ctx.stroke();

    d.y += d.speed;
    d.x += d.speed * 0.2;

    if (d.y > H) {
      d.y = -20;
      d.x = Math.random() * W;
    }
  });

  requestAnimationFrame(drawRain);
}
drawRain();

/* SLIDERS */
document.getElementById("rainSlider").oninput = e => {
  dropCount = Number(e.target.value);
  initRain();
};

document.getElementById("timeSlider").oninput = e => {
  const v = e.target.value / 100;
  const brightness = 0.4 + v * 1.2;
  const tint = v * 40;

  back.style.filter = `brightness(${brightness}) blur(1px)`;
  mid.style.filter = `brightness(${brightness}) hue-rotate(${tint}deg)`;
  front.style.filter = `brightness(${brightness}) hue-rotate(${tint}deg)`;
};

/* DEFAULT */
setScene("night");
</script>

</body>
</html>
